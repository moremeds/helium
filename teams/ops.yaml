manifestVersion: team-v1
name: ops-incident-analysis-team

roles:
  diagnostician:
    responsibility: analysis
    requires: [ops-diagnosis]
    permissions:
      externalResearch: false
      mutations: forbidden
      artifactRead: [source-artifacts]
  independent-verifier:
    responsibility: verification
    requires: [ops-independent-verification, fresh-evidence]
    permissions:
      externalResearch: false
      mutations: forbidden
      artifactRead: [source-artifacts, dependency-artifacts]
  incident-lead:
    responsibility: synthesis
    requires: [ops-incident-lead]
    permissions:
      externalResearch: false
      mutations: permitted
      artifactRead: [source-artifacts, dependency-artifacts, accepted-claim-ledger]
  reporter:
    responsibility: synthesis
    requires: [ops-incident-reporting]
    permissions:
      externalResearch: false
      mutations: forbidden
      artifactRead: [dependency-artifacts, accepted-claim-ledger]

tasks:
  - id: diagnosis
    role: diagnostician
    dependsOn: []
    requires: [ops-diagnosis]
    inputs: [source-artifacts]
    outputSchema: OpsDiagnosis.v1
  - id: independent-verification
    role: independent-verifier
    dependsOn: []
    requires: [ops-independent-verification, fresh-evidence]
    inputs: [source-artifacts]
    outputSchema: OpsVerification.v1
  - id: incident-decision
    role: incident-lead
    dependsOn: [diagnosis, independent-verification]
    requires: [ops-incident-lead]
    inputs: [source-artifacts, dependency-artifacts, accepted-claim-ledger]
    outputSchema: OpsSopSelection.v1
  - id: incident-report
    role: reporter
    dependsOn: [incident-decision]
    requires: [ops-incident-reporting]
    inputs: [dependency-artifacts, accepted-claim-ledger]
    outputSchema: OpsIncidentReport.v1

crossReference:
  compareClaims: true
  materialContradictions: fresh-evidence-work-order
  requireIndependentEvidence: true

budgets:
  maxAttempts: 12
  maxTokens: 80000

acceptance:
  allowPartialClaims: true
  terminalTasks: [incident-report]
