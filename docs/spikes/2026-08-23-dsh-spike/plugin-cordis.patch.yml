- insert:
    - id: health-sensor
      name: 'dsh-plugin-health-sensor'
      config:
        url: !!js process.env.SENSOR_URL
        intervalMs: !!js Number(process.env.SENSOR_INTERVAL_MS)
        outFile: !!js process.env.SENSOR_OUT
        fields: [ok, db, version, worker_lag_seconds, latency_p95_ms, watchlist_size]
