  - id: P0-DELIVERY-WRITE-AHEAD-CRASH-REPLAY
    phase: P0
    assertion: No external delivery side effect occurs that the audit trail has not
      already announced, and an intent orphaned by a crash reaches a durable
      terminal state rather than silently disappearing.
    assertionClass: deterministic
    command: pnpm run test
    toolVersion: node 22.19.0 (pinned in .github/workflows/ci.yml:21,41); pnpm
      11.24.0; vitest 3.2.7
    outputHash: sha256:bf0bcb88ba24a994d5c9d9bbbc3904812dd86760ce2be53ed4db6dc2e6d59584
    decision: pass
    artifacts:
      - path: docs/evidence/p0/test.log
        sha256: bf0bcb88ba24a994d5c9d9bbbc3904812dd86760ce2be53ed4db6dc2e6d59584
    status: PROVEN
    limitation: "This is NOT exactly-once delivery and must never be described as
      such: SMTP acceptance followed by a crash before the outcome append is
      genuinely indeterminate, which is precisely why `uncertain` is a terminal
      state. What is proven is write-ahead ordering, at most one unresolved
      intent per deliveryId, no blind retry, and a durable uncertain outcome.
      Proven against a fake transport, not a real SMTP server."
    nextGate: "P2 Task 15: recovery reconciliation across the team kernel."
