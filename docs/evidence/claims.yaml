# The closed claims register.
#
# The evidence ledger records decisions; it does not bound the population those
# decisions are drawn from. An open claim set has no denominator, so nothing in
# it can ever be found MISSING. This file is that denominator: one row per
# already-decided or already-scheduled claim, and every later phase gate
# appends to this same file. No phase creates a second register.
#
# The P0 rows are not re-authored here. They are copied from
# `docs/evidence/p0-manifest.yaml`, and
# `contracts/tests/claims-register.contract.spec.ts` fails if the two ever
# disagree on a command, tool version, output hash, decision or status.
#
# HOW THIS REGISTER IS RE-VERIFIED, AND WHY NOT BY RE-RUNNING THE COMMAND
# ----------------------------------------------------------------------
# The implementation plan asks the register's contract test to "re-run each
# deterministic claim's command at its pinned tool version and compare the
# sha256 of the output against the recorded hash". That is not implementable as
# written, for two independent reasons, so the test does the checkable thing
# instead and this note records the deviation rather than hiding it:
#
#   1. An output hash is not reproducible. The captured output carries
#      wall-clock durations and start times, so re-running the SAME commit
#      yields a different hash every time. `p0-manifest.yaml` says so in its own
#      header. A test comparing them would fail on every run, forever, for a
#      tree that is entirely correct.
#   2. Two of the recorded commands are `pnpm run test:contracts`. The register's
#      contract test IS part of that suite, so re-running the command from
#      inside it recurses without bound.
#
# What the contract test does instead is deterministic and falsifiable:
#   - it fails on an empty or unparseable register (zero rows is a failure, not
#     a vacuous pass);
#   - it re-hashes every committed artifact a decided claim cites and compares
#     against the recorded `sha256`, so a silently edited or replaced evidence
#     file fails the gate;
#   - it cross-checks every P0 row against `p0-manifest.yaml` field by field;
#   - it requires a `PARTIAL` row to name its missing proof, and refuses a
#     `PROVEN` row whose verifier decision is not `pass`.
#
# The recorded `outputHash` therefore pins one specific CI run's output as an
# immutable record. Re-running a command re-verifies the ASSERTION, never the
# hash.
#
# A `PLANNED` row carries no hash and no artifacts: it names a claim whose gate
# has not been reached. It is here so the claim cannot be quietly dropped.
registerVersion: 1
claims:
  - id: P0-ISOLATION-UNDECLARED-TOOL
    phase: P0
    assertion: An execution target cannot invoke a tool outside its declared contract.
    assertionClass: deterministic
    command: pnpm run test:contracts
    toolVersion: node 22.19.0 (pinned in .github/workflows/ci.yml:21,41); pnpm
      11.24.0; vitest 3.2.7
    outputHash: sha256:80c3b17abb6052e9d883b7d3973e4c542d2e060888edce5d0e99379a82381445
    decision: pass
    artifacts:
      - path: docs/evidence/p0/test-contracts.log
        sha256: 80c3b17abb6052e9d883b7d3973e4c542d2e060888edce5d0e99379a82381445
    status: PROVEN
    limitation: This proves the ARGUMENTS the harness composes and what the child
      observes of its environment. It does NOT prove the real Claude CLI honours
      those flags — every fixture is a fake binary. The flag semantics rest on
      the 2.1.250 help output verified on 2026-08-28, recorded in the
      implementation plan's Task 1.
    nextGate: "P1 Task 10: the formal Executor adapts to this same subject shape and
      inherits this contract."
  - id: P0-EXECUTION-BOUNDARY-CONFORMANCE
    phase: P0
    assertion: The execution-boundary contract is a reusable suite parameterized
      over a subject, not a one-off test of the senior lane, and a subject
      cannot declare a stronger isolation class than the harness can
      demonstrate.
    assertionClass: deterministic
    command: pnpm run test:contracts
    toolVersion: node 22.19.0 (pinned in .github/workflows/ci.yml:21,41); pnpm
      11.24.0; vitest 3.2.7
    outputHash: sha256:80c3b17abb6052e9d883b7d3973e4c542d2e060888edce5d0e99379a82381445
    decision: pass
    artifacts:
