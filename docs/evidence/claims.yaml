        sha256: 80c3b17abb6052e9d883b7d3973e4c542d2e060888edce5d0e99379a82381445
    status: PARTIAL
    limitation: "PARTIAL because the SECOND HALF of the acceptance bound is not
      visible in the artifact. The recorded run proves the first half: the
      senior lane passes every assertion under both a one-tool and a zero-tool
      declaration. It does NOT prove that raising declaredIsolationClass to
      `sandboxed` fails the suite — the grader for that exists
      (contracts/harness/execution-boundary.ts:346-352) but no committed test
      declares `sandboxed`, so CI only ever exercises the green path. That half
      was checked by hand during authoring and by hand is not evidence. Closing
      it is one added case that declares `sandboxed` and asserts the suite
      rejects it. Separately, the senior lane is a PROCESS boundary and not a
      filesystem sandbox: the child can read and write outside its workspace,
      which the harness grades honestly rather than asserting containment it
      cannot demonstrate."
    nextGate: "P1 Task 10: a second subject (the fake executor) exercises the
      harness's genericity."
