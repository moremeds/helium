# Phase 0 exit evidence — filled-in frozen `p0-1` template
#
# The field list below is FROZEN by the multi-agent master plan
# ("Frozen P0 evidence-manifest template"). It is filled in here, not
# redesigned. Phase 1 Task 7 lands `claims.yaml` beside this file and takes
# these deterministic claims as its first rows.
#
# WHERE THE HASHES COME FROM
# --------------------------
# The master plan requires that every `outputHash` be recorded from CI at the
# Node version pinned in `.github/workflows/ci.yml`, and states plainly that "a
# hash captured on a developer machine is not admissible". Every hash below
# comes from exactly one run:
#
#   run:    https://github.com/moremeds/helium/actions/runs/33230016008
#   commit: 8ed09de427c8d40fd6d087886bebdb3ee1fa6923 (feat/multi-agent-phase0)
#   node:   22.19.0   pnpm: 11.24.0   vitest: 3.2.7
#
# That run is also the first one in which the whole Phase 0 gate executed. CI
# previously ran only `build`, `typecheck`, `test` and `test:contracts`; the
# gate additionally requires `test:e2e-local` and both `scripts/deadman/` tests,
# and no CI job executed any of the three, so those claims had no admissible
# hash source at all rather than merely an unrecorded one. `8ed09de` wires all
# three into the `check` job. Doing so exposed two BSD-only constructs
# (`date -v` and `mktemp -t <prefix>`) that fail under GNU coreutils — the
# scripts had only ever run on macOS. Both are now written portably, which is
# itself part of what this run proves.
#
# HOW TO RECOMPUTE A HASH
# -----------------------
# Each `artifacts[].path` is the committed captured output of one CI step,
# extracted from `gh run view 33230016008 --log` by: keeping only lines whose
# tab-separated job and step fields match that step, dropping the leading
# `job<TAB>step<TAB>` prefix and the ISO-8601 timestamp that follows it,
# stripping SGR escape sequences (which `gh` emits in caret notation as the two
# literal bytes `^[`, not as ESC), and right-stripping each line.
#
#   sha256sum docs/evidence/p0/<file>
#
# Two claims are verified by more than one CI step. Their `outputHash` is the
# sha256 of those artifacts concatenated in the order their command runs them,
# and `artifacts` lists them in that same order:
#
#   cat docs/evidence/p0/a.log docs/evidence/p0/b.log | sha256sum
#
# WHAT THE HASH DOES AND DOES NOT PIN
# -----------------------------------
# The captured output contains wall-clock durations and start times, so a
# re-run of the same commit produces a DIFFERENT hash. The hash pins this
# specific run's output as an immutable record; it is not a reproducibility
# invariant. `reproduction` is for re-running the assertions and comparing
# results, never for byte-matching the hash.
#
# STATUS IS JUDGED AGAINST `acceptanceBound`, NOT AGAINST THE ASSERTION'S IDEAL
# ----------------------------------------------------------------------------
# A claim is `PROVEN` when the command's output demonstrates everything its own
# `acceptanceBound` names, and `PARTIAL` when part of that bound is not visible
# in the artifact — even if that part has been checked by hand. Two claims are
# `PARTIAL` on exactly those grounds and say which half is missing.
# `limitation` then names what the claim still does not prove at all.
