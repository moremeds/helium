# Phase 1 exit evidence — frozen `p0-1` template, now schema-validated
#
# Phase 0's manifest was hand-written because the EvidenceManifest schema did
# not exist yet. It does now (Task 7), and this file validates against it:
# `packages/core/tests/evidence-manifest.spec.ts` parses BOTH committed
# manifests, so a field a later phase renames or over-tightens breaks a test
# rather than quietly invalidating a phase's exit artifact.
#
# WHERE THE HASHES COME FROM
# --------------------------
#   run:    https://github.com/moremeds/helium/actions/runs/33242395526
#   commit: 5f879d8  (feat/multi-agent-phase1)
#   node:   22.19.0 (pinned, .github/workflows/ci.yml:21,49)
#   pnpm:   11.24.0   vitest: 3.2.7
#
# The recorded run is the one whose tree merges. An earlier run's hashes were
# discarded when a flaky fsync timeout in the event-store suite was fixed:
# recording a run whose test suite differs from the merged one would describe a
# tree that never existed.
#
# A hash captured on a developer machine is not admissible. That rule is why
# the install/removal drill was wired into CI in 5f879d8 rather than recorded
# from the terminal it was first run in: it had passed by hand, and by hand is
# not evidence.
#
# The captured output carries wall-clock durations, so re-running the same
# commit produces a DIFFERENT hash. The hash pins this run's output as an
# immutable record; `reproduction` re-runs the assertion, never the hash.
#
# STATUS IS JUDGED AGAINST `acceptanceBound`
# ------------------------------------------
# PROVEN means the artifact demonstrates everything the claim's own
# acceptanceBound names. Two claims are PARTIAL because part of their bound is
# not demonstrated, and each says which part. Neither was rounded up.
