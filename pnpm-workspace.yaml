packages:
  - packages/*
  - plugins/*
  - contracts
  - contracts/fixtures/plugin-live-dispatch
  - contracts/fixtures/mcp-ping
  - contracts/fixtures/plugin-restrict-proof
  - contracts/fixtures/senior-isolation
  - contracts/fixtures/ops-controller
  - contracts/fixtures/team-host
allowBuilds:
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  "@google/genai": true
  "@deepseek-ai/dsh-subprocess-local": true
# The `installModelSelection` patch on dsh-subagent-in-process-driver is gone.
# Read this before ever re-adding it, because the obvious reading is wrong: the
# patch did NOT add the `resolveChildAgentOptions(...)` argument at
# `agents.create` — 0.1.1-rc.2 already passed it there. The patch's real delta
# was calling `installModelSelection(childCtx, {current: {provider, model,
# reasoningEffort}})` inside `setup`, because create()'s agentOptions did not by
# themselves drive the child's LLM route. 0.1.2-alpha.3's driver contains no
# `installModelSelection` at all (grep of the installed lib/index.js: 0 hits);
# child model selection now rides on `agent/request` defaulting to the agent's
# own options on the first request.
#
# The evidence that this actually holds is empirical, not the changelog:
# contracts/tests/team-host.contract.spec.ts:138-141 asserts the observed
# DeepSeek request carries `reasoningEffort: "max"`, and it ran green against
# 0.1.2-alpha.3 (19 files / 119 tests passed, 2026-09-01). If that assertion is
# ever skipped or deleted, this deletion becomes unproven — re-add the patch or
# replace the proof, do not assume.

# Everything under `minimumReleaseAgeExclude` below is written by pnpm, not by
# hand. pnpm refuses to install a package published too recently; `pnpm install`
# does not fail on one, it silently appends a per-package waiver here and
# proceeds — so the guard ends up self-waived rather than enforced. All 215
# entries are 0.1.2-alpha.3, published 2026-08-31T16:20:52Z (npm registry
# `time`), and this install ran inside that window. Where the window length
# comes from is NOT established and should not be asserted either way:
# `pnpm config get minimumReleaseAge` returns undefined and nothing in this
# repo sets it, yet pnpm generated these waivers anyway — so it is a pnpm
# built-in default or a machine-level setting, and nobody has checked which.
#
# ACCEPTED AS A DELIBERATE ONE-OFF, 2026-09-01. Waiting out the window and
# reinstalling was the alternative, and it was explicitly declined: the call was
# that this particular dsh bump carries no meaningful action surface, so the
# delay buys nothing. Recording it here because a public repo should show this
# as a decision someone made, not as an unexplained artifact pnpm left behind.
# It is a judgement about THIS bump, not a standing policy.
#
# Keep the entries in exactly this form. Each is pinned to `name@0.1.2-alpha.3`,
# so the list expires on its own — no future dsh version matches any row. A
# global `minimumReleaseAge: 0` would be one line instead of 215, but it would
# disable the guard for every package forever; ugly and self-limiting beats
# tidy and unbounded.
#
# At the NEXT dsh bump: delete this whole key first. Otherwise pnpm appends a
# second generation of waivers on top of a dead one, and the list only grows.
