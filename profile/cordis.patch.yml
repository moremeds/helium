# helium's profile patch layer. Applied after the dsh-plugin-helium bundle
# layer, so this block replaces that row's entire config — restate every
# field, never only the changed one. Mirrors plugins/helium/cordis.patch.yml's
# pinned env contract (task-3.1-brief.md Step 11); the two must stay in sync.
- id: helium
  config:
    jobsDir: !!js process.env.HELIUM_JOBS_DIR
    tenantsDir: !!js process.env.HELIUM_TENANTS_DIR
    tenantDeliveryEnabled: !!js process.env.HELIUM_TENANT_DELIVERY === '1'
    tenantLivenessMs: !!js Number(process.env.HELIUM_TENANT_LIVENESS_MS || '300000')
    teamShadowEnabled: !!js process.env.HELIUM_TEAM_SHADOW_ENABLED === '1'
    teamPromotionMode: !!js process.env.HELIUM_TEAM_PROMOTION_MODE || 'off'
    teamCanaryTenants: !!js (process.env.HELIUM_TEAM_CANARY_TENANTS || '').split(',').filter(Boolean)
    teamCanaryMaxPerUtcDay: !!js Number(process.env.HELIUM_TEAM_CANARY_MAX_PER_UTC_DAY || '1')
    teamsDir: !!js process.env.HELIUM_TEAMS_DIR
    opsEventLog: !!js process.env.HELIUM_OPS_EVENT_LOG
    stateRoot: !!js process.env.HELIUM_STATE_ROOT
    contextFile: !!js process.env.HELIUM_CONTEXT_FILE
    calendarsDir: !!js process.env.HELIUM_CALENDARS_DIR
    argonBase: !!js process.env.HELIUM_ARGON_BASE
    apexBase: !!js process.env.HELIUM_APEX_BASE
    livewireDb: !!js process.env.HELIUM_LIVEWIRE_DB
    envFile: !!js process.env.HELIUM_ENV_FILE
    claudeTokenFile: !!js process.env.HELIUM_CLAUDE_TOKEN_FILE
    proxy: !!js process.env.HELIUM_PROXY || 'http://127.0.0.1:7897'
    mcpBin: !!js process.env.HELIUM_MCP_BIN
    emailTo: !!js process.env.HELIUM_EMAIL_TO
