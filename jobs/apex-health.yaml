name: apex-health
enabled: true
triggers:
  - kind: state-change
    url: http://127.0.0.1:8322/health
    fields: [status, pg_connected]
    interval: 60s
    dedup: 30m
engine:
  triage: { engine: deepseek, model: deepseek-v4-flash }
  senior: { engine: claude-max }
escalate_when: severity >= critical
session: fresh
memory: none
tools: [apex_api]
allowMutations: false
max_turns: { triage: 2, senior: 4 }
timeout: 5m
budget: { max_triage_per_hour: 12, max_senior_per_day: 2 }
delivery:
  jsonl: true
  email:
    to: operator
    subject_prefix: "[helium/apex]"
    max_per_hour: 2
prompt: |
  You watch apex's own health endpoint (http://127.0.0.1:8322/health), the signal
  computation engine behind argon's charts. The trigger section carries the previous
  and current values of the watched fields.

  Triage: severity is `noise` for a version bump or a counter moving; `minor` for a
  degraded subsystem that still serves; `critical` only when the service reports
  itself unhealthy or a dependency is down (pg_connected false). Emit the verdict
  JSON and nothing else.

  Senior (rare, critical only): say in five lines what is down, what downstream
  surface stops working (argon charts, signal queries), and the single next
  diagnostic command. No speculation about causes you cannot see in the payload.
