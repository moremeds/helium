# The tenant-seam proof. It exists only so CI can remove and re-add a whole
# tenant without editing packages/core, and so `helium run fake-tenant` is a
# real end-to-end path that touches no network and knows no business domain.
#
# `enabled: true` is safe here precisely because it has no cron trigger and no
# delivery channel: discovery is a glob over `plugins/*/tenant.yaml`, so a
# tenant that ships a schedule ships a scheduled run. This one runs only when
# a human asks for it by name.
tenant: fake-tenant
enabled: true
team: team.yaml
sandbox: none
budget:
  usd: 0.05
  tokens: 20000
triggers: []
delivery: []
