manifestVersion: "2"
name: fake-tenant
# Two roles, so routing has to distinguish two capability sets, and a
# three-task DAG so the topological order is actually exercised. No role names
# a model; `requires` is the only routing input.
roles:
  prober:
    requires: [tool.use, cheap.bulk]
    permissions:
      mutations: forbidden
      tools: [fake_probe, fake_count]
    persona: >-
      You call the tools you are given and report exactly what they returned.
  scribe:
    requires: [structured.output, cheap.bulk]
    permissions:
      mutations: forbidden
      tools: []
    persona: >-
      You summarise the prior steps in at most three sentences.
tasks:
  - id: probe
    role: prober
    requires: [tool.use]
    prompt: Call fake_probe with q="hello" and report what it echoed.
  - id: count
    role: prober
    dependsOn: [probe]
    requires: [tool.use]
    prompt: Call fake_count with text="hello world" and report the counts.
  - id: report
    role: scribe
    dependsOn: [probe, count]
    requires: [structured.output]
    prompt: Summarise what the two probe steps found.
