# option-wizard — helium's first tenant on the team lane.
# Source of truth: docs/plans/2026-09-02-option-wizard-tenant-spec.md.
#
# Everything this tenant knows about options, IB, argon and Unusual Whales
# lives in this directory and nowhere in packages/core (doctrine 2).
tenant: option-wizard
enabled: true
team: team.yaml

# Sandbox `none`: no filesystem write capability, and no tool with
# order-placement semantics is ever registered, so "never place an order" is
# structural rather than a prompt (spec §5).
sandbox: none

# Spec §6. The sum of the per-role caps is 370k tokens / $1.70; this is the run
# ceiling with headroom. Real cost is read back from the audit table, never
# estimated: SELECT role, SUM(cost_usd) FROM span WHERE run_id = ? GROUP BY role
budget:
  usd: 2.00
  tokens: 400000

# Key NAMES only — no value ever appears in this file (spec §3).
env:
  - OW_TV_ENABLED
  - OPENCLI_BIN
  # Frank's Substack path. Separate from OPENCLI_BIN so the substack/web reader
  # can be pointed at a different build without disabling TradingView too.
  - OW_OPENCLI_BIN
  # The operator's ticker list, used only where TradingView is not installed.
  - OW_UNIVERSE
  - OW_ARGON_PG_URL
  - OW_APEX_API_BASE
  # argon's FastAPI, for ow_argon_levels — real technical/gamma/options-
  # structure levels, not the Postgres tables OW_ARGON_PG_URL reads.
  - OW_ARGON_API_BASE
  - OW_PSQL_BIN
  - OW_IB_API_BASE
  - OW_IB_API_KEY
  - OW_IB_MAX_SNAPSHOT_AGE_HOURS
  - OW_UW_API_KEY
  # massive.com (ex-Polygon), for ow_massive_actions — dated splits and
  # ex-dividends. argon already talks to the same provider under the SAME
  # names (uw_scan/config.py), so the operator holds one key and two consumers.
  - MASSIVE_API_KEY
  # Optional; defaults to https://api.massive.com, the same default argon uses.
  - MASSIVE_BASE_URL
  # argon's ingest for structured runs. Separate from OW_ARGON_API_BASE, which
  # is a TOOL's read endpoint: this one is a WRITE and it is authenticated.
  # Reusing one key for both is how a laptop ends up publishing to the mini.
  - ARGON_BASE_URL
  - ARGON_INGEST_TOKEN
  # argon's PUBLIC origin, for the one link the abridged mail carries. A THIRD
  # argon key on purpose: this one is pasted into an email a human clicks, so
  # it is the machine's outside address, not the ingest endpoint and not a
  # tool's read endpoint. Unset means the mail carries no link.
  - ARGON_APP_BASE

# The zone this tenant's DAY is counted in — the report file name, the email
# subject, the per-day email cap and the `report day:` line the agent is given
# all take their date from here, and the runner resolves it once per run so the
# four cannot disagree.
#
# US/Eastern and not Asia/Hong_Kong, which is the zone the triggers below are
# scheduled in: a US trading session has exactly one unambiguous date, and it is
# this one. A run fired at 01:00 HKT on the 3rd is 13:00 ET on the 2nd, and its
# report is about the 2nd. Named, never an offset, because this zone DOES
# observe DST.
reportTimezone: America/New_York

# The days this tenant has nothing to say about, in the zone above. launchd
# fires the five triggers below EVERY day — none of the plists carries a Weekday
# key — so without this block a holiday produces a full run and a briefing about
# a session that never happened. A closed day is a completed run with no steps,
# no mail and one audit row; it is not a failure, and it must not read as one.
#
# NYSE full-day closures, MAINTAINED BY HAND from
# https://www.nyse.com/markets/hours-calendars (verified against that page
# 2026-09-05). Early closes (1:00 p.m. ET) are NOT listed: a half session is a
# session, and the brief is still about a real tape. Whoever extends this list
# past 2027-02 reads that page again rather than deriving the dates.
#
# `appliesTo` names the three session phases and NOT weekly or frank, which is
# load-bearing: weekly fires Sunday 08:00 ET and frank Monday 09:00 ET, and both
# are reviews of a week that has already happened. A calendar applied to every
# phase alike would delete the Sunday briefing outright and drop frank on every
# holiday Monday — Labor Day, MLK, Presidents Day, Memorial Day.
calendar:
  weekdaysOnly: true
  appliesTo: [premarket, intraday, close]
  closed:
    - 2026-09-07 # Labor Day
    - 2026-11-26 # Thanksgiving Day
    - 2026-12-25 # Christmas Day
    - 2027-01-01 # New Year's Day
    - 2027-01-18 # Martin Luther King, Jr. Day
    - 2027-02-15 # Washington's Birthday

# The regime step ends its reply with one ```regime-state fence. The runner
# lifts it out before anything keeps the text and writes it to
# <stateRoot>/option-wizard/<day>/<phase>.regime.json; ow_prior_brief reads
# that record instead of re-reading yesterday's whole markdown brief, which is
# how intraday used to re-tell premarket's cause in premarket's words.
# The host validates only that the block is a JSON object; the SHAPE is
# plugins/option-wizard/state/regime.ts and the gate that enforces it is
# plugins/option-wizard/gates/regime-state.ts.
stateBlock:
  fence: regime-state
  suffix: regime.json

# DECLARATIVE ONLY. Nothing in this repo runs a cron loop: launchd is the
# scheduler and `launchd/com.helium.option-wizard-<phase>.plist` is where the
# time actually lives. These five entries exist so the schedule is readable
# next to the tenant it schedules, and they must be kept in step with the
# plists BY HAND — a drift between the two is invisible until an email is
# missing. Timezone is named, never a UTC offset: HK does not observe DST, but
# writing +08:00 would make that a property of this file instead of the zone.
triggers:
  # 08:45 ET — after the 08:30 ET major-data slot (NFP/CPI/etc land in the
  # window), still well before the 09:30 open. The US tape is FROZEN at this
  # hour regardless; see the regime prompt.
  - kind: cron
    schedule: "45 20 * * *"
    timezone: Asia/Hong_Kong
    phase: premarket
  # Monday only, 09:00 ET. Frank posts 12:37 UTC = 20:37 HKT, two and a half
  # hours after Monday's premarket, so he cannot ride along with it.
  - kind: cron
    schedule: "0 21 * * 1"
    timezone: Asia/Hong_Kong
    phase: frank
  # 13:00 ET, mid-session: the tape is live here and nowhere else.
  - kind: cron
    schedule: "0 1 * * *"
    timezone: Asia/Hong_Kong
    phase: intraday
  # 16:15 ET, after the close: markout settles against final prints, not
  # estimates. The cost is that the reader sees it next morning.
  - kind: cron
    schedule: "15 4 * * *"
    timezone: Asia/Hong_Kong
    phase: close
  # Sunday 08:00 ET.
  - kind: cron
    schedule: "0 20 * * 0"
    timezone: Asia/Hong_Kong
    phase: weekly

# The report is a MARKDOWN FILE, not mail. The email recipients were lost with
# the same section of the spec, and a channel whose one required setting is
# unknown cannot be configured honestly — whereas a file on the machine that
# produced the run needs no recipient, no credential and no operator brake.
# The `email` entry below was added once the recipient could come from the
# environment; the markdown file remains the artifact that needs no credential.
delivery:
  - channel: markdown
    config:
      dir: reports
  # Mail is external, so this entry alone sends nothing: the channel is resolved
  # first and then asked whether it leaves the machine, and it does — so it also
  # needs the operator's HELIUM_TENANT_DELIVERY=1 and a reachable SMTP_HOST.
  # Three independent conditions, deliberately: intent here, authority in the
  # brake, capability in the environment. The recipient is HELIUM_EMAIL_TO
  # rather than a literal, so nobody's inbox is committed to the repo.
  - channel: email
    config:
      subjectPrefix: "[option-wizard]"
      # Five, because the day now has five runs. The counter is per
      # `reportTimezone` day — America/New_York above, not UTC — so the day
      # boundary is 00:00 ET = 12:00 HKT (13:00 HKT in winter). Each HK trigger
      # lands on this ET date:
      #
      #   premarket  20:45 HKT -> 08:45 ET, SAME date
      #   frank  Mon 21:00 HKT -> 09:00 ET Monday
      #   intraday   01:00 HKT -> 13:00 ET, PREVIOUS date
      #   close      04:15 HKT -> 16:15 ET, PREVIOUS date
      #   weekly Sun 20:00 HKT -> 08:00 ET Sunday
      #
      # So one ET date collects that morning's premarket plus the intraday and
      # close fired the next HK morning: 3 mails. ET Monday adds frank and ET
      # Sunday adds weekly, for 4. Peak is 4, under the cap of 5, and DST does
      # not move any phase across a boundary (the shift is one hour, the
      # nearest boundary is five away). WHOEVER ADDS A SIXTH must first work
      # out its ET date.
      maxPerDay: 5
  # The Flash page. External like mail — the row does not leave the building but
  # a person reads it as a briefing — so this entry alone sends nothing: it also
  # needs HELIUM_TENANT_DELIVERY=1 and a reachable ARGON_BASE_URL. Three
  # independent conditions: intent here, authority in the brake, capability in
  # the environment. No baseUrl in this file: the environment is the only place
  # it is set, so the manifest cannot commit a machine's URL to the repo.
  #
  # `kinds` is not a filter anyone wants today. It exists so that adding a SIXTH
  # phase is a deliberate line here rather than a page that silently gains a tab.
  - channel: argon
    config:
      kinds: [premarket, intraday, close, weekly, frank]
      # Which ISO week each kind's row is FILED under. Frank posts on Monday
      # about the week that just ended, so his review belongs to that earlier
      # week and not to the day it was published. Every other kind is about the
      # day it ran. The channel knows the rule names and never the kind names,
      # so this mapping is the tenant's word, not the channel's.
      weekKeyRules:
        frank: previous-iso-week

# The tenant-owned opaque block; the host never reads inside it (spec §3).
#
# EMPTY DELIBERATELY. Every numeric threshold below was lost with the original
# spec (§8.4, §9) and none of them is reconstructable from the desk's doctrine
# alone. The preflight gate reads them from here and REFUSES by name when they
# are absent, so an unconfigured risk limit is a refusal and never a pass. The
# keys it looks for, for whoever fills them in:
#
#   gates:
#     buying_power:      { maxMarginFractionOfNetLiq: <n>, minBuyingPowerUsd: <n> }
#     liquidity:         { maxSpreadFractionOfMid: <n>, minOpenInterest: <n> }
#     event_window:      { minDte: <n>, maxDte: <n> }
#     position_conflict: { maxPerUnderlyingFractionOfNetLiq: <n>,
#                          maxPortfolioFractionOfNetLiq: <n> }
extensions:
  # The weekly review's lookback windows, in TRADING days — counted with the
  # `calendar` block above, never with a subtraction from a date. 5 is the week
  # just ended, 10 the fortnight, 21 the month. Read only by this tenant's own
  # ow_review_window tool; the host carries this block and never opens it.
  review:
    windows: [5, 10, 21]
    coverage: # ORDER IS THE PRINT ORDER. Rows are never dropped.
      - rates.front # 2Y level + bp change
      - rates.long # 10Y / 30Y level + bp change
      - curve.shape # steepen / flatten, bull or bear
      - policy.path # dated meeting, hike/cut odds
      - credit # HY OAS
      - vol # VIX + term structure
      - dealer.positioning # call wall / put wall / zero gamma
      - flow # ETF tide, sector tide
      - commodities # gold, crude
      - fx # DXY
      - equity.internals # index %, sector leaders/laggards
      - calls.open # our published candidates and forecasts still pending —
        # NEVER real positions/size/PnL. The /flash page is public;
        # 仓位 is a separate, private project.
    # Each entry is an argon watchlist chain name, VERBATIM from
    # `GET /watchlist/chains` (uw_scan/watchlist_taxonomy.py is the source of
    # truth). Members come from `GET /watchlist?chain=<name>` via
    # OW_ARGON_API_BASE. One coverage row per entry, same verdict token, same
    # <=15-word clause. Members and weekly % are renderer-filled, never recalled.
    sectors:
      - Computer/GPU
      - Semi-Logic/ASIC
      - Foundry
      - Semi-Cap/EDA
      - Memory/Storage
      - Cybersecurity
      - Software/SaaS
      - Cloud/Hyperscaler
      - Foundation-Model-Proxy
      - Devices/Endpoint
    verdicts: [continue, reverse, strengthen, fade, untested]
    # `weeklyModelWords`/`dailyModelWords` are the totals spec C.6/§J cap; the
    # per-section numbers are what render/budget.ts trims to.
    #
    # `dailyModelWords` was 300 — written before the coverage table existed,
    # and it budgeted for §2 and §4 alone. The daily document also carries the
    # model's per-row clauses: 22 model-answered coverage rows (23 declared,
    # less the renderer-filled `calls.open`) x two clauses, a `why` capped at
    # `rowWords` 10 and an `observable` of about the same, is ~240 words that
    # no cap accounted for. The 2026-09-04 close measured 483 against 300, of
    # which .s3 alone was 241. 300 + 240 = 540, rounded to 550.
    #
    # The PER-FIELD caps are unchanged: §2 <= 120 and §4 <= 180 still bound the
    # prose, so this raises no paragraph's length. Weekly is untouched.
    caps:
      weeklyModelWords: 900
      dailyModelWords: 550
      reviewWords: 300
      weekly:
        {
          review: 300,
          outlook: 400,
          catalysts: 150,
          rowWords: 15,
          focusWords: 20,
          themeWords: 25,
        }
      daily:
        {
          review: 120,
          outlook: 180,
          catalysts: 60,
          rowWords: 10,
          focusWords: 20,
          themeWords: 25,
        }
    # §G. The list is COMPUTED, never chosen: these weights and windows are
    # the whole methodology, and they live here so helium-self can diff them
    # and so a re-weight is a reviewable PR rather than a prompt edit. They
    # are a DECLARED PRIOR (2026-09-06), not fitted — §I.6 re-weights them
    # from focusHitRate after ~8 weeks, and the renderer prints
    # "weights: declared prior 2026-09-06" under the focus table until it does.
    focus:
      weekly: 15
      daily: 5
      # Points. An event ON the day earns the full weight and decays in a
      # straight line to zero at its window's end; an event already past
      # earns nothing (it happened — 关注 is about what is ahead).
      weights:
        earnings: 10
        corporate: 8
        macroNamed: 4
        openCall: 6
        theme: 3
        flowAnomaly: 3
        pinned: 2
        # §I.1 assignment risk: an ex-dividend date INSIDE an open call's
        # window, from ow_massive_actions. Weighted just under `openCall`
        # because it only ever fires on a name we already have a commitment
        # on — it sharpens an existing admission rather than creating one.
        # Declared prior, like every weight here.
        assignmentRisk: 6
      # OPEN sessions, counted with the `calendar` block above.
      windows:
        {
          earnings: 7,
          corporate: 10,
          macroNamed: 5,
          openCall: 10,
          assignmentRisk: 5,
        }
      # score DESC, then nearest event ASC, then ticker A-Z. Alphabetical
      # last so a tie is stable across runs — that is what makes the 15
      # replayable.
      tieBreak: [score, daysToNearestEvent, ticker]
      # ow_uw_earnings is one HTTP round trip PER TICKER. The universe is the
      # argon chains plus the TV flag lists and can exceed 80 names, so the
      # lookup is capped and the truncation is REPORTED (pinned first, then
      # alphabetical, so which 60 is deterministic).
      maxEarningsLookups: 60
      # ow_uw_iv_term takes at most 3 tickers per call: 15 names = 5 calls.
      maxIvTermCalls: 5
      # Operator-dated events with no machine feed: §I.3 index rebalances,
      # index add/remove, spin-offs, §I.4 product days. Splits and
      # ex-dividends do NOT belong here — ow_massive_actions serves them
      # (Task 6). Hand-kept, dated, PR-reviewed; `ticker: MARKET` makes it a
      # macroNamed event for every universe member. Empty is fine.
      calendarPins: []
      #  - { ticker: MARKET, day: 2026-09-18, kind: corporate,
      #      label: "S&P quarterly rebalance effective" }
    # §H. A theme lands ONLY with a pollable evidence line, a horizon and a
    # kill condition. No kill, no theme — the loader refuses it and the tenant
    # is skipped with the reason, which is the only way a register stays a
    # register instead of a mood.
    themes:
      - id: el-nino-ag-2026
        thesis: "El Nino 2026 tightens soft/grain supply; medium-term bid for ag inputs and grain"
        horizon: 6m
        entered: 2026-09-06
        instruments: [DBA, MOS, NTR, DE] # what we watch, not what we hold
        evidence:
          - text: "NOAA ONI monthly >= +0.5 for 3 consecutive months"
            # No tool serves NOAA. `tool:` is optional and its absence prints
            # `evidence: operator-checked` on the row — honest, and it does
            # not block the verdict, which settles on the excess-move number.
          - text: "CBOT corn/wheat front-month vs 20d"
        kill: "ONI < +0.5 two months running, or instruments underperform SPY by 10% over 60 sessions"
        # The machine-checkable half of `kill`, so the renderer can print
        # CONDITION MET without reading English. Optional.
        killExcess: { pct: -10, sessions: 60 }
    # §H.4. The eleven Select Sector SPDRs plus the theme baskets, against
    # SPY. In yaml so an operator can correct the list without a code change;
    # Task 9 Step 1 confirms every symbol answers from ow_apex_bars, and one
    # that does not prints `untested` rather than being dropped.
    rotation:
      benchmark: SPY
      lookbacks: { w1: 5, w4: 20, w12: 60 } # OPEN sessions
      sectorEtfs: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
