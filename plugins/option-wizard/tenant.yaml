# option-wizard — helium's first tenant on the team lane.
# Source of truth: docs/plans/2026-09-02-option-wizard-tenant-spec.md.
#
# Everything this tenant knows about options, IB, argon and Unusual Whales
# lives in this directory and nowhere in packages/core (doctrine 2).
tenant: option-wizard
enabled: true
team: team.yaml

# Sandbox `none`: no filesystem write capability, and no tool with
# order-placement semantics is ever registered, so "never place an order" is
# structural rather than a prompt (spec §5).
sandbox: none

# Spec §6. The sum of the per-role caps is 370k tokens / $1.70; this is the run
# ceiling with headroom. Real cost is read back from the audit table, never
# estimated: SELECT role, SUM(cost_usd) FROM span WHERE run_id = ? GROUP BY role
budget:
  usd: 2.00
  tokens: 400000

# Key NAMES only — no value ever appears in this file (spec §3).
env:
  - OW_TV_ENABLED
  - OPENCLI_BIN
  # Frank's Substack path. Separate from OPENCLI_BIN so the substack/web reader
  # can be pointed at a different build without disabling TradingView too.
  - OW_OPENCLI_BIN
  # The operator's ticker list, used only where TradingView is not installed.
  - OW_UNIVERSE
  - OW_ARGON_PG_URL
  - OW_APEX_API_BASE
  # argon's FastAPI, for ow_argon_levels — real technical/gamma/options-
  # structure levels, not the Postgres tables OW_ARGON_PG_URL reads.
  - OW_ARGON_API_BASE
  - OW_PSQL_BIN
  - OW_IB_API_BASE
  - OW_IB_API_KEY
  - OW_IB_MAX_SNAPSHOT_AGE_HOURS
  - OW_UW_API_KEY

# The zone this tenant's DAY is counted in — the report file name, the email
# subject, the per-day email cap and the `report day:` line the agent is given
# all take their date from here, and the runner resolves it once per run so the
# four cannot disagree.
#
# US/Eastern and not Asia/Hong_Kong, which is the zone the triggers below are
# scheduled in: a US trading session has exactly one unambiguous date, and it is
# this one. A run fired at 01:00 HKT on the 3rd is 13:00 ET on the 2nd, and its
# report is about the 2nd. Named, never an offset, because this zone DOES
# observe DST.
reportTimezone: America/New_York

# DECLARATIVE ONLY. Nothing in this repo runs a cron loop: launchd is the
# scheduler and `launchd/com.helium.option-wizard-<phase>.plist` is where the
# time actually lives. These five entries exist so the schedule is readable
# next to the tenant it schedules, and they must be kept in step with the
# plists BY HAND — a drift between the two is invisible until an email is
# missing. Timezone is named, never a UTC offset: HK does not observe DST, but
# writing +08:00 would make that a property of this file instead of the zone.
triggers:
  # 06:00 ET — the US tape is FROZEN at this hour; see the regime prompt.
  - kind: cron
    schedule: "0 18 * * *"
    timezone: Asia/Hong_Kong
    phase: premarket
  # Monday only, 09:00 ET. Frank posts 12:37 UTC = 20:37 HKT, two and a half
  # hours after Monday's premarket, so he cannot ride along with it.
  - kind: cron
    schedule: "0 21 * * 1"
    timezone: Asia/Hong_Kong
    phase: frank
  # 13:00 ET, mid-session: the tape is live here and nowhere else.
  - kind: cron
    schedule: "0 1 * * *"
    timezone: Asia/Hong_Kong
    phase: intraday
  # 16:15 ET, after the close: markout settles against final prints, not
  # estimates. The cost is that the reader sees it next morning.
  - kind: cron
    schedule: "15 4 * * *"
    timezone: Asia/Hong_Kong
    phase: close
  # Sunday 08:00 ET.
  - kind: cron
    schedule: "0 20 * * 0"
    timezone: Asia/Hong_Kong
    phase: weekly

# The report is a MARKDOWN FILE, not mail. The email recipients were lost with
# the same section of the spec, and a channel whose one required setting is
# unknown cannot be configured honestly — whereas a file on the machine that
# produced the run needs no recipient, no credential and no operator brake.
# The `email` entry below was added once the recipient could come from the
# environment; the markdown file remains the artifact that needs no credential.
delivery:
  - channel: markdown
    config:
      dir: reports
  # Mail is external, so this entry alone sends nothing: the channel is resolved
  # first and then asked whether it leaves the machine, and it does — so it also
  # needs the operator's HELIUM_TENANT_DELIVERY=1 and a reachable SMTP_HOST.
  # Three independent conditions, deliberately: intent here, authority in the
  # brake, capability in the environment. The recipient is HELIUM_EMAIL_TO
  # rather than a literal, so nobody's inbox is committed to the repo.
  - channel: email
    config:
      subjectPrefix: "[option-wizard]"
      # Five, because the day now has five runs. The counter is per
      # `reportTimezone` day — America/New_York above, not UTC — so the day
      # boundary is 00:00 ET = 12:00 HKT (13:00 HKT in winter). Each HK trigger
      # lands on this ET date:
      #
      #   premarket  18:00 HKT -> 06:00 ET, SAME date
      #   frank  Mon 21:00 HKT -> 09:00 ET Monday
      #   intraday   01:00 HKT -> 13:00 ET, PREVIOUS date
      #   close      04:15 HKT -> 16:15 ET, PREVIOUS date
      #   weekly Sun 20:00 HKT -> 08:00 ET Sunday
      #
      # So one ET date collects that morning's premarket plus the intraday and
      # close fired the next HK morning: 3 mails. ET Monday adds frank and ET
      # Sunday adds weekly, for 4. Peak is 4, under the cap of 5, and DST does
      # not move any phase across a boundary (the shift is one hour, the
      # nearest boundary is five away). WHOEVER ADDS A SIXTH must first work
      # out its ET date.
      maxPerDay: 5

# The tenant-owned opaque block; the host never reads inside it (spec §3).
#
# EMPTY DELIBERATELY. Every numeric threshold below was lost with the original
# spec (§8.4, §9) and none of them is reconstructable from the desk's doctrine
# alone. The preflight gate reads them from here and REFUSES by name when they
# are absent, so an unconfigured risk limit is a refusal and never a pass. The
# keys it looks for, for whoever fills them in:
#
#   gates:
#     buying_power:      { maxMarginFractionOfNetLiq: <n>, minBuyingPowerUsd: <n> }
#     liquidity:         { maxSpreadFractionOfMid: <n>, minOpenInterest: <n> }
#     event_window:      { minDte: <n>, maxDte: <n> }
#     position_conflict: { maxPerUnderlyingFractionOfNetLiq: <n>,
#                          maxPortfolioFractionOfNetLiq: <n> }
extensions: {}
