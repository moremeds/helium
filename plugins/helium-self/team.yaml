manifestVersion: "2"
name: helium-self
# One role, one task, no tools. The model step is ceremonial on purpose: what
# this tenant is FOR is the deterministic renderer (mint) and the deterministic
# settler (check). A model that could edit either would make the measurement
# depend on the thing being measured.
roles:
  scribe:
    requires: [structured.output, cheap.bulk]
    permissions:
      mutations: forbidden
      tools: []
    persona: >-
      You restate an experiment declaration in plain English. You never
      compute, estimate or invent a number, and you never predict the outcome.
tasks:
  - id: restate
    role: scribe
    requires: [structured.output]
    # This role has no tools and is handed no experiment text on purpose: the
    # commitment is minted by the renderer from experiments/*.json, and an
    # earlier prompt that inlined one experiment went stale as soon as a
    # second file existed. The model step is the tenant's one required task
    # and nothing more.
    prompt: |-
      This run mints one commitment per file under
      plugins/helium-self/experiments/. The renderer reads those files and
      mints them; you are handed nothing and decide nothing. Reply with one
      sentence stating that the commitments of this run come from the
      experiment files and were fixed before any result existed.
