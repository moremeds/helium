name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/core/lib is gitignored build output; plugins/helium and
      # contracts both import @helium/core through its published exports
      # (./lib/index.js), so typecheck/test need it built first — matches
      # the contracts job below, which already has this step.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      # The Phase 0 gate requires these three alongside `test`, and none of them
      # ran here before: `pnpm test` does not reach the e2e project (separate
      # config) and neither dead-man test is wired to a package.json script. An
      # unrun test is not evidence, and the P0 evidence manifest may only record
      # an output hash from a CI run at the pinned Node version.
      - run: pnpm run test:e2e-local
      - run: node --test scripts/deadman/check-tenant-heartbeats.test.mjs
      - run: bash scripts/deadman/check-heartbeat.test.sh
      - name: offline ops signing and release-boundary tests
        run: >-
          node --test
          scripts/ops/actions/install-action-wrapper.test.mjs
          scripts/ops/actions/trading-stack-reconcile.test.mjs
          scripts/ops/sign-approval.test.mjs
          scripts/ops/sign-suggestion-decision.test.mjs
          scripts/ops/sign-authority-manifest.test.mjs
          scripts/ops/configure-suggest-only.test.mjs
          scripts/ops/controlled-mutation.test.mjs
          scripts/ops/export-promotion-input.test.mjs
          scripts/ops/promotion-package.test.mjs
          scripts/review/team-canary.test.mjs
          scripts/release/validate-tenants.test.mjs
          scripts/release/check-plist-paths.test.mjs
          scripts/release/opsd-cycle-after.test.mjs
      - name: repeat adversarial ops boundaries 20 times
        run: >-
          bash scripts/test-repeat.sh 20
          pnpm exec vitest run --project contracts
          contracts/tests/ops-action-boundary.contract.spec.ts
          contracts/tests/ops-controller.contract.spec.ts
      # The Phase 1 exit gate claims each fake executor package can be removed
      # and re-added without editing core or the plugin. That claim was only
      # ever checked by hand, and a hash captured on a developer machine is not
      # admissible -- so the drill runs here, last, because it deliberately
      # mutates node_modules and the lockfile.
      - name: fake executor and fake tenant install and remove with no core edit
        run: |
          set -eu
          for pkg in fake-metered fake-flat-rate; do
            echo "--- @helium/$pkg: remove ---"
            pnpm --filter @helium/contracts remove "@helium/$pkg"
            echo "--- @helium/$pkg: add back ---"
            pnpm --filter @helium/contracts add -D "@helium/$pkg@file:../packages/$pkg"
          done
          # The tenant seam: a whole tenant leaves and returns as a DIRECTORY,
          # because that is what a tenant is -- there is no registry entry and
          # no loader list to edit, so the proof is that moving the directory
          # away and back changes nothing in core or the host.
          echo "--- plugins/fake-tenant: remove ---"
          mv plugins/fake-tenant "$RUNNER_TEMP/fake-tenant"
          pnpm install --no-frozen-lockfile
          pnpm run build
          # fake-tenant.test.ts skips itself while the tenant is absent -- it
          # asserts the tenant is PRESENT, so it would fail for the wrong
          # reason. `vitest --exclude` is silently ignored for a --project run,
          # so the guard is in the file, not this flag.
          pnpm run test
          echo "--- plugins/fake-tenant: add back ---"
          mv "$RUNNER_TEMP/fake-tenant" plugins/fake-tenant
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm run test
          changed=$(git diff --name-only -- packages/core plugins/helium)
          if [ -n "$changed" ]; then
            echo "FAIL: install/removal edited core or the plugin:"
            echo "$changed"
            exit 1
          fi
          echo "PASS: packages/core and plugins/helium unchanged"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # HELIUM_LIVE is never set here: CI holds no secrets and makes no
      # network LLM calls (spec §12, plan global constraints).
      - run: pnpm run test:contracts

  ops-macos-offline:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: macOS Livewire recovery contract
        run: >-
          pnpm exec vitest run --project contracts
          contracts/tests/livewire-shepherd-recovery.contract.spec.ts
      # Redirected temporary roots only: this renders and removes packaging,
      # but never loads launchd or touches a live host installation.
      - run: bash scripts/ops/install-observe-only.test.sh
