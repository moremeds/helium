name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/core/lib is gitignored build output; plugins/helium and
      # contracts both import @helium/core through its published exports
      # (./lib/index.js), so typecheck/test need it built first — matches
      # the contracts job below, which already has this step.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      # The Phase 0 gate requires these three alongside `test`, and none of them
      # ran here before: `pnpm test` does not reach the e2e project (separate
      # config) and neither dead-man test is wired to a package.json script. An
      # unrun test is not evidence, and the P0 evidence manifest may only record
      # an output hash from a CI run at the pinned Node version.
      - run: pnpm run test:e2e-local
      - run: node --test scripts/deadman/check-tenant-heartbeats.test.mjs
      - run: bash scripts/deadman/check-heartbeat.test.sh

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # HELIUM_LIVE is never set here: CI holds no secrets and makes no
      # network LLM calls (spec §12, plan global constraints).
      - run: pnpm run test:contracts
