name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/core/lib is gitignored build output; every plugin and the
      # contracts import @helium/core through its published exports
      # (./lib/index.js), so typecheck/test need it built first.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      # HELIUM_LIVE is never set here: CI holds no secrets and makes no
      # network LLM calls.
      - run: pnpm run test:contracts
